server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback for React Router (BrowserRouter)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: cache static assets aggressively (Vite outputs hashed filenames)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
